name: OAuth spike APK

on:
  push:
    branches: [main]
    paths: ["spike/android-oauth/**", ".github/workflows/spike-oauth-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/android-oauth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk datchart-oauth-spike.apk
      - name: Pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spike-oauth-${{ github.run_number }}
          name: OAuth spike ${{ github.run_number }}
          body: Throwaway spike build from ${{ github.sha }}. Since build 4 it installs next to builds 1-3 (new app id) and later builds update it in place (fixed debug key). See spike/android-oauth/README.md.
          files: spike/android-oauth/datchart-oauth-spike.apk
          prerelease: true
          make_latest: false
